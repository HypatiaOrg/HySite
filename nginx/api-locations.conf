# The Django API, the same on both frontends' hosts (included by each server block in default.conf)

# Static files for the django-api Site
location ^~ /hypatia/api/static/ {
    # Deny access, unless it is GET (HEAD is included with GET)
    limit_except GET {
        deny all;
    }
    alias /django/static/;
}

# the Django-API site
location /hypatia/api/ {
    # Deny access, unless it is GET
    limit_except GET {
        deny all;
    }
    set $djangoService django-api:8111;
    proxy_pass http://$djangoService;
    proxy_http_version 1.1;
    proxy_set_header   Host $http_host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_max_temp_file_size 0;
    proxy_request_buffering off;
}
