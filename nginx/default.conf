map $http_upgrade $connection_upgrade
{
  default upgrade;
  '' close;
}

server {
    # listen on port 80, except connctions from any IP with 0.0.0.0
    listen 0.0.0.0:80;
    # underscore indicated all server names are allowed.
    server_name _;
    # the site only receives small form posts
    client_max_body_size 1m;
    # don't show the nginx version
    server_tokens off;

    # The is Docker's internal DNS resolver, keep it valid for 30s and retry
    resolver 127.0.0.11 valid=30s;

    location / {
        # the web2py pages only use GET (which includes HEAD) and POST
        limit_except GET POST {
            deny all;
        }
        # hide web2py's banner and add the security headers Django already sends for the API
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # resolve at request time so nginx starts even if the frontend is not up yet
        set $web2pyService web-to-py:8222;
        proxy_pass http://$web2pyService;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }

    # hypatiaCatalog static files and plots
        # Static files for the django-api Site
    location ^~ /hypatia/api/static/ {
        # Deny access, unless it is GET (HEAD is included with GET)
        limit_except GET {
            deny all;
        }
        alias /django/static/;
        # Debugging options to verify the static files are being served correctly
        # autoindex on;               # enable directory listing output
        # autoindex_exact_size off;   # output file sizes rounded to kilobytes, megabytes, and gigabytes
        # autoindex_localtime on;     # output local times in the directory
    }
    # the Django-API site
    location /hypatia/api/ {
        # Deny access, unless it is GET
        limit_except GET {
            deny all;
        }
        set $djangoService django-api:8111;
        proxy_pass http://$djangoService;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }
}
