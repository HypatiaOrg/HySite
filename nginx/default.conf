# Two frontends on one API. In production the host name picks the frontend (the HTTPS edge, HyRoute,
# passes it through): hypatiacatalog.com is the web2py frontend, as before; new.hypatiacatalog.com is the
# Next.js frontend, for people to try before it takes over. For testing, the port picks it: port 80 is
# Next.js for any other host name (http://localhost/), and port 8082 is always web2py (http://localhost:8082/).

map $http_upgrade $connection_upgrade
{
  default upgrade;
  '' close;
}

# the scheme the visitor used: what the HTTPS edge (HyRoute) says, or our own when there is no edge.
# web2py marks its session cookie Secure when this is https
map $http_x_forwarded_proto $forwarded_proto
{
  default $http_x_forwarded_proto;
  '' $scheme;
}

# the largest form post is a pasted star list: all 14,085 catalog names is about 200 KB, and long
# IDs (e.g. Gaia DR3) for every star about 600 KB, so 4 MB leaves room
client_max_body_size 4m;
# don't show the nginx version
server_tokens off;
# redirects give the path only (Location: /help), so they work behind the HTTPS edge and on any port
absolute_redirect off;
# a Next.js plot page's settings are in its URL (a shareable link); a long star list makes it longer than
# the 8k default. The edge (HyRoute) and the Next.js server allow the same
large_client_header_buffers 4 64k;
# The is Docker's internal DNS resolver, keep it valid for 30s and retry
resolver 127.0.0.11 valid=30s;

# The web2py frontend: the site as it is today, at hypatiacatalog.com, and on port 8082 for any host
server {
    listen 0.0.0.0:80;
    listen 0.0.0.0:8082 default_server;
    server_name hypatiacatalog.com www.hypatiacatalog.com;

    location / {
        # the web2py pages only use GET (which includes HEAD) and POST
        limit_except GET POST {
            deny all;
        }
        # hide web2py's banner and add the security headers Django already sends for the API
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # resolve at request time so nginx starts even if the frontend is not up yet
        set $web2pyService web-to-py:8222;
        proxy_pass http://$web2pyService;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }

    include /etc/nginx/hysite/api-locations.conf;
}

# The Next.js frontend: new.hypatiacatalog.com, and port 80 for any other host (http://localhost/)
server {
    listen 0.0.0.0:80 default_server;
    server_name new.hypatiacatalog.com;

    location / {
        # GET (HEAD is included with GET) for the pages, POST for the plot and table data: the page sends
        # its settings to a Next.js route handler (frontend/app/data), which asks the API inside the network
        limit_except GET POST {
            deny all;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # resolve at request time so nginx starts even if the frontend is not up yet
        set $nextFrontend next-frontend:3000;
        proxy_pass http://$nextFrontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }

    # the web2py pages' addresses on this host go to Next.js, which redirects them to its pages
    # (frontend/next.config.ts), so the app works the same without nginx

    include /etc/nginx/hysite/api-locations.conf;
}
