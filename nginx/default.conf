map $http_upgrade $connection_upgrade
{
  default upgrade;
  '' close;
}

# the scheme the visitor used: what the HTTPS edge (HyRoute) says, or our own when there is no edge.
# web2py marks its session cookie Secure when this is https
map $http_x_forwarded_proto $forwarded_proto
{
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
    # listen on port 80, except connctions from any IP with 0.0.0.0
    listen 0.0.0.0:80;
    # underscore indicated all server names are allowed.
    server_name _;
    # the largest form post is a pasted star list: all 14,085 catalog names is about 200 KB, and long
    # IDs (e.g. Gaia DR3) for every star about 600 KB, so 4 MB leaves room
    client_max_body_size 4m;
    # don't show the nginx version
    server_tokens off;
    # redirects give the path only (Location: /help), so they work behind the HTTPS edge and on any port
    absolute_redirect off;
    # a plot page's settings are in its URL (a shareable link); a long star list makes it longer than the
    # 8k default. The edge (HyRoute) and the Next.js server allow the same
    large_client_header_buffers 4 64k;

    # The is Docker's internal DNS resolver, keep it valid for 30s and retry
    resolver 127.0.0.11 valid=30s;

    # The NEXT.js (React) frontend website
    location / {
        # GET (HEAD is included with GET) for the pages, POST for the plot and table data: the page sends
        # its settings to a Next.js route handler (frontend/app/data), which asks the API inside the network
        limit_except GET POST {
            deny all;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # resolve at request time so nginx starts even if the frontend is not up yet
        set $nextFrontend next-frontend:3000;
        proxy_pass http://$nextFrontend;
        root /app;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }

    # pages ported from web2py to the Next.js frontend keep their old address as a redirect
    location = /hypatia/default/help {
        return 301 /help;
    }
    location = /hypatia/default/about {
        return 301 /about;
    }
    location = /hypatia/default/credits {
        return 301 /acknowledgements;
    }
    # the plot pages (their settings, if any, come along in the query; /launch sorts out ?mode=)
    location = /hypatia/default/launch {
        return 301 /launch$is_args$args;
    }
    location = /hypatia/default/targets {
        return 301 /targets$is_args$args;
    }
    location = /hypatia/default/hist {
        return 301 /hist$is_args$args;
    }

    # the web2py frontend: its pages and its static files (/api, once web2py's API page, is Next.js's now)
    location ~ ^/(hypatia/default|hypatia/static) {
        # the web2py pages only use GET (which includes HEAD) and POST
        limit_except GET POST {
            deny all;
        }
        # hide web2py's banner and add the security headers Django already sends for the API
        proxy_hide_header X-Powered-By;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # resolve at request time so nginx starts even if the frontend is not up yet
        set $web2pyService web-to-py:8222;
        proxy_pass http://$web2pyService;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }

    # hypatiaCatalog static files and plots
    # Static files for the django-api Site
    location ^~ /hypatia/api/static/ {
        # Deny access, unless it is GET (HEAD is included with GET)
        limit_except GET {
            deny all;
        }
        alias /django/static/;
        # Debugging options to verify the static files are being served correctly
        # autoindex on;               # enable directory listing output
        # autoindex_exact_size off;   # output file sizes rounded to kilobytes, megabytes, and gigabytes
        # autoindex_localtime on;     # output local times in the directory
    }
    # the Django-API site
    location /hypatia/api/ {
        # Deny access, unless it is GET
        limit_except GET {
            deny all;
        }
        set $djangoService django-api:8111;
        proxy_pass http://$djangoService;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_max_temp_file_size 0;
        proxy_request_buffering off;
    }
}
