# Python logging for web2py (copied to the web2py directory by the Dockerfile; gluon/main.py loads it).
# Everything goes to stdout, which is the container's log (docker logs frontend-web2py); nothing is
# written to files, so this works with READ_ONLY=true. WARNING and above only.
[loggers]
keys=root,web2py,hypatia

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_web2py]
level=WARNING
handlers=consoleHandler
qualname=web2py
propagate=0

# logging.getLogger("web2py.app.hypatia") in the application
[logger_hypatia]
level=WARNING
handlers=consoleHandler
qualname=web2py.app.hypatia
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=WARNING
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=
